name: Build macOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14 # Apple Silicon (M系列芯片)；Intel 芯片可改为 macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Update pubspec.lock & install dependencies
        run: |
          # 移除脚本中可能强制要求 lockfile 一致的参数
          python3 -c '
          import glob, pathlib
          for p in glob.glob("scripts/*.py"):
               path = pathlib.Path(p)
               text = path.read_text(encoding="utf-8")
               if "--enforce-lockfile" in text:
                  path.write_text(text.replace("\"--enforce-lockfile\",", "").replace("'\''--enforce-lockfile'\'',", "").replace("--enforce-lockfile", ""), encoding="utf-8")
          '
          flutter config --enable-macos-desktop
          flutter pub get

      - name: Build 홍果鉴 (Single Source) for macOS
        run: |
          mkdir -p artifacts_out/hongguojian
          if python3 scripts/build_macos.py; then
            cp -R dist/macos/* artifacts_out/hongguojian/ 2>/dev/null || true
          else
            echo "Fallback to manual native + flutter build (hongguojian)..."
            python3 scripts/build_native.py --platform macos || true
            flutter build macos --release
          fi
          if [ -d "build/macos/Build/Products/Release" ]; then
            cd build/macos/Build/Products/Release
            for app in *.app; do
              [ -e "$app" ] || continue
              ditto -c -k --sequesterRsrc --keepParent "$app" "${GITHUB_WORKSPACE}/artifacts_out/hongguojian/${app%.app}-hongguojian-macos.zip"
            done
          fi

      - name: Build 真果鉴 (All Sources) for macOS
        run: |
          mkdir -p artifacts_out/zhenguojian
          if python3 scripts/build_macos.py --all-sources; then
            cp -R dist/macos/* artifacts_out/zhenguojian/ 2>/dev/null || true
          else
            echo "Fallback to manual native + flutter build (zhenguojian)..."
            python3 scripts/build_native.py --platform macos --all-sources || true
            flutter build macos --release --dart-define=ALL_SOURCES=true
          fi
          if [ -d "build/macos/Build/Products/Release" ]; then
            cd build/macos/Build/Products/Release
            for app in *.app; do
              [ -e "$app" ] || continue
              ditto -c -k --sequesterRsrc --keepParent "$app" "${GITHUB_WORKSPACE}/artifacts_out/zhenguojian/${app%.app}-zhenguojian-macos.zip"
            done
          fi

      - name: Upload hongguojian-macos Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hongguojian-macos
          path: artifacts_out/hongguojian/

      - name: Upload zhenguojian-macos Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-macos
          path: artifacts_out/zhenguojian/
